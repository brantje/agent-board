name: Issue 136 final P3 cleanup

on:
  push:
    branches:
      - feat/136-squad-issue-ownership
    paths:
      - .github/workflows/issue-136-final-p3-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: agent_board_test
          POSTGRES_USER: agent_board
          POSTGRES_PASSWORD: agent_board
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U agent_board -d agent_board_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_BOARD_TEST_DATABASE_RESET: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/136-squad-issue-ownership
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Configure database
        run: echo "AGENT_BOARD_TEST_DATABASE_URL=postgres://agent_board:agent_board@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/agent_board_test?sslmode=disable" >> "$GITHUB_ENV"
      - name: Apply cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "apps/server/internal/store/postgres/assignment.go",
              "// The caller holds the Issue row lock through commit: policy, readiness,\n// pair-scoped duplicate suppression, attempt allocation and enqueue are atomic.\n// The returned Event is non-zero only when this call persisted run.created.\nfunc resolveIssueExecutionAgent",
              "// resolveIssueExecutionAgent maps canonical Issue ownership to its current execution Agent.\nfunc resolveIssueExecutionAgent",
          )

          replace_once(
              "docs/scheduler.md",
              "- an already Agent-assigned Issue leaving `BACKLOG` enqueues for `TODO`, `IN_PROGRESS`, `BLOCKED` or `REVIEW`, but not `DONE`;",
              "- an already Agent- or Squad-owned Issue leaving `BACKLOG` enqueues for `TODO`, `IN_PROGRESS`, `BLOCKED` or `REVIEW`, but not `DONE`; Squad execution resolves its current leader Agent while ownership remains the Squad;",
          )

          replace_once(
              "docs/scheduler.md",
              "Assignment preserves Board status. An ownership-eligible Agent remains assigned even when its execution configuration cannot currently create a Run; the mutation succeeds without a pending-execution flag. Execution-configuration reconciliation uses the same enqueue path (see below).",
              "Assignment preserves Board status. Agent or Squad ownership remains unchanged when the resolved execution Agent's configuration cannot currently create a Run; the mutation succeeds without a pending-execution flag. Execution-configuration reconciliation uses the same enqueue path (see below).",
          )
          PY
          gofmt -w apps/server/internal/store/postgres/assignment.go
      - name: Verify postgres store
        working-directory: apps/server
        run: go test ./internal/store/postgres
      - name: Verify cleanup diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'apps/server/internal/store/postgres/assignment.go\ndocs/scheduler.md'
          test "$changed" = "$expected"
      - name: Commit cleanup
        run: |
          git config user.name "agent-board implementation"
          git config user.email "agent-board-implementation@users.noreply.github.com"
          git add apps/server/internal/store/postgres/assignment.go docs/scheduler.md
          git commit -m "docs(#136): fix final ownership cleanup"
          git push origin HEAD:feat/136-squad-issue-ownership
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/issue-136-final-p3-cleanup.yml
          git commit -m "chore(#136): remove final P3 cleanup harness"
          git push origin HEAD:feat/136-squad-issue-ownership
