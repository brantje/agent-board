name: Issue 136 final review cleanup

on:
  push:
    branches:
      - feat/136-squad-issue-ownership
    paths:
      - .github/workflows/issue-136-final-review-cleanup.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: agent_board_test
          POSTGRES_USER: agent_board
          POSTGRES_PASSWORD: agent_board
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U agent_board -d agent_board_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_BOARD_TEST_DATABASE_RESET: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/136-squad-issue-ownership
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Configure database
        run: echo "AGENT_BOARD_TEST_DATABASE_URL=postgres://agent_board:agent_board@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/agent_board_test?sslmode=disable" >> "$GITHUB_ENV"
      - name: Apply remaining review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match for {old!r}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/server/internal/store/postgres/issue_execution.go',
              "\t\t  AND assignee_id IS NOT NULL\n\t\tORDER BY project_id, id",
              "\t\t  AND assignee_id IS NOT NULL\n\t\t  AND status <> 'BACKLOG'\n\t\tORDER BY project_id, id",
          )

          replace_once(
              'apps/server/internal/mcpapi/issues.go',
              'mutationTool("start_issue_run", "Explicitly start or run again using the Issue\'s current AGENT assignee. Status and ownership stay unchanged.", false, false)',
              'mutationTool("start_issue_run", "Explicitly start or run again using the Issue\'s current AGENT owner or current SQUAD leader. Status and ownership stay unchanged.", false, false)',
          )

          path = Path('docs/go-issue-assignment.md')
          text = path.read_text()
          replacements = {
              '## Automatic execution after Agent assignment\n\nChanged Agent ownership is an execution trigger in every current Board status except `BACKLOG`.\n\n- `BACKLOG` parks the Agent-owned Issue without creating a Run.\n- `TODO`, `IN_PROGRESS`, `BLOCKED`, `REVIEW` and `DONE` attempt normal Run creation.\n- User ownership and unassignment never auto-enqueue.\n\nRun creation still requires valid execution configuration for the current Agent. When that configuration is invalid or unavailable, the ownership mutation succeeds and no Run is created. Configuration reconciliation later retries eligible Agent-owned work through the same execution path.':
              '## Automatic execution after Agent or Squad assignment\n\nChanged Agent or Squad ownership is an execution trigger in every current Board status except `BACKLOG`. Squad ownership remains persisted as the Squad ID; Run creation resolves the Squad\'s current leader Agent.\n\n- `BACKLOG` parks the Agent- or Squad-owned Issue without creating a Run.\n- `TODO`, `IN_PROGRESS`, `BLOCKED`, `REVIEW` and `DONE` attempt normal Run creation for the direct Agent owner or resolved Squad leader.\n- User ownership and unassignment never auto-enqueue.\n\nRun creation still requires valid execution configuration for the resolved execution Agent. When that configuration is invalid or unavailable, the ownership mutation succeeds and no Run is created. Configuration reconciliation later retries eligible Agent- and Squad-owned work through the same execution path.',
              'For an already Agent-owned Issue, automatic enqueue occurs only when the Issue leaves `BACKLOG` for one of:':
              'For an already Agent- or Squad-owned Issue, automatic enqueue occurs only when the Issue leaves `BACKLOG` for one of:',
              '- Agent A -> Agent B preserves A\'s existing Runs and may create a new Run for B when the assignment trigger and execution configuration allow it.\n- assigning the same Agent while that Issue/Agent already has an active Run does not create a duplicate active Run;\n- switching to a User or clearing ownership preserves any active Agent Run and prevents future ownership-based reconciliation for that Issue;':
              '- Agent A -> Agent B preserves A\'s existing Runs and may create a new Run for B when the assignment trigger and execution configuration allow it. Squad A -> Squad B likewise preserves prior Runs and resolves Squad B\'s current leader for any new Run.\n- assigning the same owner is a no-op; active Run suppression remains scoped to Issue + resolved Agent.\n- switching to a User or clearing ownership preserves any active Agent Run and prevents future ownership-based reconciliation for that Issue;',
              'It uses only the Issue\'s current Agent assignee. `BACKLOG`, User-assigned and unassigned Issues are rejected; all other current Board statuses, including `DONE`, are eligible when execution configuration is valid.\n\nExplicit Start Run preserves Issue ownership and Board status. Scheduler availability does not block creation of the `QUEUED` Run and `START` job, and an already-active Run for the same Issue/Agent is not duplicated.':
              'It uses only the Issue\'s current executable owner: a direct Agent owner, or a Squad owner resolved to its current leader Agent. `BACKLOG`, User-assigned and unassigned Issues are rejected; all other current Board statuses, including `DONE`, are eligible when execution configuration is valid.\n\nExplicit Start Run preserves Issue ownership and Board status, including persisted Squad ownership. Scheduler availability does not block creation of the `QUEUED` Run and `START` job, and an already-active Run for the same Issue/resolved-Agent pair is not duplicated.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'docs/go-issue-assignment.md: expected one match, found {text.count(old)} for {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify backend
        working-directory: apps/server
        run: |
          go test ./internal/app ./internal/store ./internal/store/postgres ./internal/httpapi ./internal/mcpapi
          go vet ./internal/app ./internal/store/... ./internal/httpapi ./internal/mcpapi
      - name: Commit verified fixes
        run: |
          git config user.name "agent-board implementation"
          git config user.email "agent-board-implementation@users.noreply.github.com"
          git add apps/server/internal/store/postgres/issue_execution.go apps/server/internal/mcpapi/issues.go docs/go-issue-assignment.md
          git commit -m "fix(#136): finish execution review cleanup"
          git push origin HEAD:feat/136-squad-issue-ownership
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/issue-136-final-review-cleanup.yml
          git commit -m "chore(#136): remove final review harness"
          git push origin HEAD:feat/136-squad-issue-ownership
