name: OpenCode integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/opencode-integration.yml
      - apps/agent-runner/**
      - apps/server/**
      - packages/database/schema.sql
      - packages/runnerprotocol/**
      - packages/redact/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/opencode-integration.yml
      - apps/agent-runner/**
      - apps/server/**
      - packages/database/schema.sql
      - packages/runnerprotocol/**
      - packages/redact/**

permissions:
  contents: read

concurrency:
  group: opencode-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openrouter:
    name: OpenRouter live integration
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: agent_board_test
          POSTGRES_USER: agent_board
          POSTGRES_PASSWORD: agent_board
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U agent_board -d agent_board_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_BOARD_TEST_DATABASE_RESET: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_WHITELIST: ${{ vars.OPENROUTER_WHITELIST || secrets.OPENROUTER_WHITELIST }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Configure test database URL
        run: echo "AGENT_BOARD_TEST_DATABASE_URL=postgres://agent_board:agent_board@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/agent_board_test?sslmode=disable" >> "$GITHUB_ENV"
      - name: Select allowlisted OpenRouter model
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo 'OPENROUTER_API_KEY repository secret is required' >&2
            exit 1
          fi
          if [[ -z "${OPENROUTER_WHITELIST:-}" ]]; then
            echo 'OPENROUTER_WHITELIST repository variable or secret is required' >&2
            exit 1
          fi

          selected=''
          IFS=',' read -r -a candidates <<< "$OPENROUTER_WHITELIST"
          for candidate in "${candidates[@]}"; do
            candidate="${candidate#"${candidate%%[![:space:]]*}"}"
            candidate="${candidate%"${candidate##*[![:space:]]}"}"
            if [[ -n "$candidate" ]]; then
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo 'OPENROUTER_WHITELIST contains no model IDs' >&2
            exit 1
          fi
          if [[ "$selected" == *$'\n'* || "$selected" == *$'\r'* ]]; then
            echo 'OPENROUTER_WHITELIST contains an invalid model ID' >&2
            exit 1
          fi

          echo 'OpenCode model provider: openrouter'
          printf 'OpenCode model: %s\n' "$selected"
          printf 'AGENT_BOARD_TEST_OPENCODE_MODEL=%s\n' "$selected" >> "$GITHUB_ENV"
      - name: Verify OpenRouter API
        shell: bash
        run: |
          set -euo pipefail
          echo 'OpenRouter preflight provider: openrouter'
          printf 'OpenRouter preflight model: %s\n' "$AGENT_BOARD_TEST_OPENCODE_MODEL"

          payload="$(jq -cn --arg model "$AGENT_BOARD_TEST_OPENCODE_MODEL" '{
            model: $model,
            messages: [{role: "user", content: "Reply with OK."}],
            max_tokens: 1,
            temperature: 0
          }')"
          response_file="$RUNNER_TEMP/openrouter-preflight.json"
          http_code="$(curl -sS \
            --retry 2 \
            --retry-delay 1 \
            --connect-timeout 10 \
            --max-time 45 \
            -o "$response_file" \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            https://openrouter.ai/api/v1/chat/completions)"

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "OpenRouter preflight failed with HTTP ${http_code}" >&2
            if [[ -s "$response_file" ]]; then
              jq -r '.error.message // "OpenRouter returned an error response"' "$response_file" >&2 || true
            fi
            exit 1
          fi

          response_model="$(jq -r '.model // empty' "$response_file")"
          echo "OpenRouter preflight succeeded with HTTP ${http_code}"
          if [[ -n "$response_model" ]]; then
            printf 'OpenRouter response model: %s\n' "$response_model"
          fi
      - name: Build OpenCode Runtime image
        run: >-
          docker build
          --build-arg AGENT_BOARD_UID="$(id -u)"
          --file apps/agent-runner/Dockerfile
          --tag agent-board-opencode-runtime:ci
          .
      - name: Install pinned host OpenCode for runner E2E
        shell: bash
        run: |
          set -euo pipefail
          . apps/agent-runner/opencode.env
          archive="$RUNNER_TEMP/opencode-linux-x64-baseline.tar.gz"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64-baseline.tar.gz" \
            -o "$archive"
          echo "${OPENCODE_SHA256_AMD64_GLIBC}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/opencode-bin" opencode
          chmod 0755 "$RUNNER_TEMP/opencode-bin/opencode"
          test "$("$RUNNER_TEMP/opencode-bin/opencode" --version)" = "$OPENCODE_VERSION"
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"
      - name: Run real OpenCode/OpenRouter integration suite
        working-directory: apps/server
        env:
          AGENT_BOARD_TEST_OPENCODE: "1"
          AGENT_BOARD_TEST_DOCKER: "1"
          AGENT_BOARD_TEST_OPENCODE_RUNTIME_IMAGE: agent-board-opencode-runtime:ci
          AGENT_BOARD_TEST_OPENCODE_PROVIDER_KIND: openrouter
          AGENT_BOARD_TEST_OPENCODE_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          echo 'OpenCode integration provider: openrouter'
          printf 'OpenCode integration model: %s\n' "$AGENT_BOARD_TEST_OPENCODE_MODEL"
          if timeout --signal=TERM --kill-after=10s 780s \
            go test -count=1 -failfast -run '^(TestOpenCodeDocker(NormalCodingRun|InteractiveQuestionRoundTrip|InvalidCredentialsFailWithoutSecretLeak|CancelWhileWaitingForQuestion)|TestOpenCode(RunnerNormalCodingRun|InternalRunnerNormalCodingRun|ConcurrentRunnerSessionsNormalAndQuestions))$' -v ./internal/runexec; then
            exit 0
          fi

          echo '--- OpenCode Run diagnostics (durable, redacted state only) ---'
          PGPASSWORD=agent_board psql \
            -h 127.0.0.1 -p '${{ job.services.postgres.ports['5432'] }}' -U agent_board -d agent_board_test -x \
            -c 'SELECT id, status, failure_reason FROM runs ORDER BY created_at DESC LIMIT 1' || true
          echo '--- Execution Sessions ---'
          PGPASSWORD=agent_board psql \
            -h 127.0.0.1 -p '${{ job.services.postgres.ports['5432'] }}' -U agent_board -d agent_board_test -x \
            -c 'SELECT status, cwd, command_argv, exit_code FROM execution_sessions ORDER BY created_at' || true
          echo '--- Run Events ---'
          PGPASSWORD=agent_board psql \
            -h 127.0.0.1 -p '${{ job.services.postgres.ports['5432'] }}' -U agent_board -d agent_board_test -x \
            -c 'SELECT sequence, type, payload FROM events ORDER BY sequence' || true
          exit 1
