name: Scan phase terminology

on:
  push:
    branches:
      - phase/79-authz-hardening

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan repository
        shell: bash
        run: |
          set -u
          echo '=== PATH MATCHES ==='
          git ls-files | grep -Ei '(^|[/_.-])phase[_-]?[1-5]([/_.-]|$)|auth_phase|phase[1-5]' || true
          echo '=== CONTENT MATCHES ==='
          git grep -nEi '\b(phase[_ -]?[1-5]|phase[1-5]|AuthPhase[1-5]|AuthPhase|Phase[1-5]|Phase [1-5])\b' -- . ':(exclude).github/workflows/scan-phase-terminology.yml' || true
