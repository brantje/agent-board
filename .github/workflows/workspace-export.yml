name: Workspace export

on:
  push:
    branches:
      - bootstrap/issue-140-workspace-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - name: Archive repository
        run: git archive --format=zip --output=agent-board.zip HEAD
      - name: Vendor workspace dependencies
        run: go work vendor
      - name: Archive vendored dependencies
        run: tar -czf workspace-vendor.tar.gz vendor
      - name: Archive Go toolchain
        run: |
          GOROOT="$(go env GOROOT)"
          tar -C "$(dirname "$GOROOT")" -czf go-toolchain.tar.gz "$(basename "$GOROOT")"
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-export
          path: agent-board.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: local-test-env
          path: |
            workspace-vendor.tar.gz
            go-toolchain.tar.gz
          if-no-files-found: error
