\tresult, err := s.pool.Exec(ctx, `
\t\tDELETE FROM squads AS sq
\t\tWHERE sq.project_id=$1 AND sq.id=$2
\t\t  AND NOT EXISTS (
\t\t\tSELECT 1 FROM issues AS i
\t\t\tWHERE i.project_id=$1 AND i.assignee_type='SQUAD' AND i.assignee_id=$2
\t\t  )
\t`, projectID, squadID)
\tif err != nil {
\t\treturn err
\t}
\tif result.RowsAffected() != 0 {
\t\treturn nil
\t}
\tvar exists bool
\tif err := s.pool.QueryRow(ctx, `SELECT EXISTS(SELECT 1 FROM squads WHERE project_id=$1 AND id=$2)`, projectID, squadID).Scan(&exists); err != nil {
\t\treturn err
\t}
\tif exists {
\t\treturn store.ErrConflict
\t}
\treturn store.ErrNotFound
}

''',
          )

