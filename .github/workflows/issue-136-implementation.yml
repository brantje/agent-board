	if issue.AssigneeType == nil || issue.AssigneeID == nil {
		return "", false, nil
	}
	switch *issue.AssigneeType {
	case "AGENT":
		return *issue.AssigneeID, true, nil
	case "SQUAD":
		var agentID string
		if err := q.QueryRow(ctx, `
