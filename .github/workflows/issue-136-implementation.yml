name: Issue 136 implementation

on:
  push:
    branches:
      - feat/136-squad-issue-ownership
    paths:
      - .github/workflows/issue-136-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: agent_board_test
          POSTGRES_USER: agent_board
          POSTGRES_PASSWORD: agent_board
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U agent_board -d agent_board_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_BOARD_TEST_DATABASE_RESET: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/136-squad-issue-ownership
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure implementation environment
        run: |
          echo "AGENT_BOARD_TEST_DATABASE_URL=postgres://agent_board:agent_board@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/agent_board_test?sslmode=disable" >> "$GITHUB_ENV"
          git config user.name "agent-board implementation"
          git config user.email "agent-board-implementation@users.noreply.github.com"

      - name: Step 1 - Squad ownership persistence and directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count))

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text()
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"{path}: missing start marker {start!r}")
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f"{path}: missing end marker {end!r}")
              p.write_text(text[:a] + replacement + text[b:])

          replace(
              "packages/database/schema.sql",
              "assignee_type IN ('USER','AGENT')",
              "assignee_type IN ('USER','AGENT','SQUAD')",
          )
          replace(
              "apps/server/internal/app/assignee.go",
              '(target.Type != "USER" && target.Type != "AGENT")',
              '(target.Type != "USER" && target.Type != "AGENT" && target.Type != "SQUAD")',
          )
          replace(
              "apps/server/internal/store/postgres/core.go",
              "\t\tWHEN i.assignee_type='AGENT' THEN (SELECT name FROM agents WHERE id=i.assignee_id)\n\tEND,",
              "\t\tWHEN i.assignee_type='AGENT' THEN (SELECT name FROM agents WHERE id=i.assignee_id)\n\t\tWHEN i.assignee_type='SQUAD' THEN (SELECT name FROM squads WHERE id=i.assignee_id)\n\tEND,",
          )

          path = Path("apps/server/internal/store/postgres/assignee.go")
          text = path.read_text()
          marker = "\tdefault:\n\t\treturn nil, store.ErrInvalidArgument\n\t}\n\treturn value, nil\n}"
          if text.count(marker) != 1:
              raise SystemExit("assignee.go: default marker mismatch")
          squad_case = '''\tcase "SQUAD":
\t\tvar state string
\t\tvar inProject bool
\t\terr := q.QueryRow(ctx, `
\t\t\tSELECT sq.id::text, sq.name, a.state, sq.project_id=$1
\t\t\tFROM squads AS sq
\t\t\tJOIN agents AS a ON a.id=sq.leader_agent_id
\t\t\tWHERE sq.id=$2
\t\t`, projectID, target.ID).Scan(&value.ID, &value.Name, &state, &inProject)
\t\tif err != nil {
\t\t\treturn nil, notFound(err)
\t\t}
\t\tif !inProject {
\t\t\treturn nil, store.ErrNotFound
\t\t}
\t\tif state != "ENABLED" {
\t\t\treturn nil, store.ErrInvalidArgument
\t\t}
'''
          text = text.replace(marker, squad_case + marker, 1)
          old_agent_dir = "\t\t\tSELECT 'AGENT'::text,a.id::text,a.name\n\t\t\tFROM agents AS a\n\t\t\tWHERE `+eligibleAgentAssigneePredicate+`"
          new_agent_dir = old_agent_dir + "\n\t\t\tUNION ALL\n\t\t\tSELECT 'SQUAD'::text,sq.id::text,sq.name\n\t\t\tFROM squads AS sq\n\t\t\tJOIN agents AS a ON a.id=sq.leader_agent_id\n\t\t\tWHERE sq.project_id=$1 AND a.state='ENABLED' AND (a.project_id IS NULL OR a.project_id=$1)"
          if text.count(old_agent_dir) != 1:
              raise SystemExit("assignee.go: directory marker mismatch")
          text = text.replace(old_agent_dir, new_agent_dir, 1)
          old_lock = "LOCK TABLE users, project_user_access, project_group_access, group_members, agents IN SHARE MODE"
          if text.count(old_lock) != 1:
              raise SystemExit("assignee.go: lock marker mismatch")
          text = text.replace(old_lock, "LOCK TABLE users, project_user_access, project_group_access, group_members, agents, squads IN SHARE MODE", 1)
          path.write_text(text)

