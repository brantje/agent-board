name: Generate issue 127 lockfile

on:
  pull_request:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'tmp/127-lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp/127-lockfile
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Persist generated lockfile on helper branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m 'chore: persist generated issue 127 lockfile'
          git push origin HEAD:tmp/127-lockfile
