name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-bootstrap:
    name: Bootstrap pnpm lockfile
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate lockfile without dependency scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit lockfile once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git -c core.hooksPath=/dev/null commit -m "chore(web): commit pnpm lockfile"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:"$GITHUB_HEAD_REF"

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Test
        working-directory: apps/server
        run: go test ./...
      - name: Vet
        working-directory: apps/server
        run: go vet ./...
      - name: Build
        working-directory: apps/server
        run: go build ./...

  agent-runner:
    name: Agent runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/agent-runner/go.mod
          cache: false
      - name: Test
        working-directory: apps/agent-runner
        run: go test ./...
      - name: Vet
        working-directory: apps/agent-runner
        run: go vet ./...
      - name: Build
        working-directory: apps/agent-runner
        run: go build ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  compose:
    name: Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare workspace root
        run: |
          sudo mkdir -p /var/lib/agent-board/workspaces
          sudo chmod 0777 /var/lib/agent-board/workspaces
      - name: Build runner image
        run: docker build --file apps/agent-runner/Dockerfile --tag agent-board-agent-runner:ci .
      - name: Verify runner has no Docker socket
        run: docker run --rm --entrypoint sh agent-board-agent-runner:ci -c 'test ! -S /var/run/docker.sock'
      - name: Start stack
        run: docker compose up --detach --build --wait
      - name: Verify endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3001/healthz
          curl --fail --silent --show-error http://127.0.0.1:3000/
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
