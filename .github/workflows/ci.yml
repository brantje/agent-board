name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: agent_board_test
          POSTGRES_USER: agent_board
          POSTGRES_PASSWORD: agent_board
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_board -d agent_board_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_BOARD_TEST_DATABASE_URL: postgres://agent_board:agent_board@127.0.0.1:5432/agent_board_test?sslmode=disable
      AGENT_BOARD_TEST_DATABASE_RESET: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Test and enforce coverage
        working-directory: apps/server
        run: |
          set -eu
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          awk -v coverage="$total" 'BEGIN { printf "server coverage: %.1f%%\n", coverage; if (coverage + 0 < 85) exit 1 }'
      - name: Vet
        working-directory: apps/server
        run: go vet ./...
      - name: Build
        working-directory: apps/server
        run: go build ./...

  agent-runner:
    name: Agent runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/agent-runner/go.mod
          cache: false
      - name: Test and enforce coverage
        working-directory: apps/agent-runner
        run: |
          set -eu
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          awk -v coverage="$total" 'BEGIN { printf "agent-runner coverage: %.1f%%\n", coverage; if (coverage + 0 < 85) exit 1 }'
      - name: Vet
        working-directory: apps/agent-runner
        run: go vet ./...
      - name: Build
        working-directory: apps/agent-runner
        run: go build ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test and enforce coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build

  compose:
    name: Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare workspace root
        run: |
          sudo mkdir -p /var/lib/agent-board/workspaces
          sudo chmod 0777 /var/lib/agent-board/workspaces
      - name: Verify repository mount override
        env:
          AGENT_BOARD_REPOSITORY_MOUNT_PATH: /mnt/repositories
        run: |
          set -eu
          docker compose config --format json > /tmp/agent-board-compose.json
          jq -e '.services.server.environment.AGENT_BOARD_REPOSITORY_ROOTS == "/mnt/repositories"' /tmp/agent-board-compose.json
          jq -e 'any(.services.server.volumes[]; .target == "/mnt/repositories")' /tmp/agent-board-compose.json
      - name: Build runner image
        run: docker build --file apps/agent-runner/Dockerfile --tag agent-board-agent-runner:ci .
      - name: Verify runner has no Docker socket
        run: docker run --rm --entrypoint sh agent-board-agent-runner:ci -c 'test ! -S /var/run/docker.sock'
      - name: Start stack
        run: docker compose up --detach --build --wait
      - name: Verify endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3001/healthz
          curl --fail --silent --show-error http://127.0.0.1:3000/
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
