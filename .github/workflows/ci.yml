name: Workspace source artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    name: Source artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Package source
        run: tar --exclude=.git -czf /tmp/agent-board-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: agent-board-source
          path: /tmp/agent-board-source.tar.gz
          if-no-files-found: error
          retention-days: 1
