name: Workspace dependency artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download Go modules
        run: |
          set -eu
          (cd apps/server && go mod download)
          (cd apps/agent-runner && go mod download)
          (cd packages/runnerprotocol && go mod download)
          (cd packages/redact && go mod download)
          (cd packages/workspacegit && go mod download)
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Package dependencies
        run: |
          set -eu
          tar -C "$(go env GOPATH)" -czf /tmp/go-pkg-mod.tar.gz pkg/mod
          tar -czf /tmp/node-modules.tar.gz node_modules apps/web/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-dependencies
          path: |
            /tmp/go-pkg-mod.tar.gz
            /tmp/node-modules.tar.gz
          if-no-files-found: error
          retention-days: 1
