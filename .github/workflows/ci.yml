name: Workspace toolchain artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  toolchain:
    name: Toolchain artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Package toolchains
        run: |
          set -eu
          tar -C "$(dirname "$(go env GOROOT)")" -czf /tmp/go-1.25.0.tar.gz "$(basename "$(go env GOROOT)")"
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          tar -C "$(dirname "$node_root")" -czf /tmp/node-24-pnpm.tar.gz "$(basename "$node_root")"
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-toolchains
          path: |
            /tmp/go-1.25.0.tar.gz
            /tmp/node-24-pnpm.tar.gz
          if-no-files-found: error
          retention-days: 1
