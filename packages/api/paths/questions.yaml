path1:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  get:
    operationId: listQuestions
    description: Lists Project-scoped Questions. Optional filters narrow by Issue, Run, or Question status.
    parameters:
    - name: issueId
      in: query
      schema:
        type: string
        format: uuid
    - name: runId
      in: query
      schema:
        type: string
        format: uuid
    - name: status
      in: query
      schema:
        type: string
        enum: [OPEN, ANSWERED, CANCELLED]
    responses:
      '200':
        description: Questions in created order.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/questions.yaml#/Question
      default:
        $ref: ../components/api-components.yaml#/responses/Error

path2:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - name: questionID
    in: path
    required: true
    schema:
      type: string
      format: uuid
  get:
    operationId: getQuestion
    description: Reads one Project-scoped Question.
    responses:
      '200':
        description: Question.
        content:
          application/json:
            schema:
              $ref: ../schemas/questions.yaml#/Question
      default:
        $ref: ../components/api-components.yaml#/responses/Error

path3:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - name: questionID
    in: path
    required: true
    schema:
      type: string
      format: uuid
  post:
    operationId: answerQuestion
    description: Records a human answer and Decision. Blocking answers may queue a durable resume job.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/questions.yaml#/QuestionAnswerRequest
    responses:
      '200':
        description: Answered Question, Decision, and current Run.
        content:
          application/json:
            schema:
              $ref: ../schemas/questions.yaml#/QuestionAnswerResponse
      default:
        $ref: ../components/api-components.yaml#/responses/Error
