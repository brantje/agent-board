path1:
  get:
    operationId: listProjects
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/ProjectList
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createProject
    description: Project workflowSettings may include newIssuePlacement with value top or bottom; omitted configuration defaults new Issues to the bottom of their initial Board state.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/ProjectCreate
    responses:
      '201':
        $ref: ../components/api-components.yaml#/responses/Project
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path2:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  get:
    operationId: getProject
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Project
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  patch:
    operationId: updateProject
    description: Project workflowSettings may include newIssuePlacement with value top or bottom. The setting affects only subsequent Issue creation and does not reorder existing Issues.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/ProjectUpdate
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Project
      default:
        $ref: ../components/api-components.yaml#/responses/Error
