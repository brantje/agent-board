path1:
  put:
    operationId: putGlobalSecret
    description: Stores or replaces a global secret. Plaintext is write-only and is never returned.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/SecretUpsert
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/SecretMetadata
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path2:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  put:
    operationId: putProjectSecret
    description: Stores or replaces a Project-scoped secret. Plaintext is write-only and is never returned.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/SecretUpsert
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/SecretMetadata
      default:
        $ref: ../components/api-components.yaml#/responses/Error
