path1:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  get:
    operationId: getRunEvidence
    description: Reconstructs immutable execution evidence for one Project-scoped Run without exposing blob storage references.
    responses:
      '200':
        description: Complete durable Run evidence projection.
        content:
          application/json:
            schema:
              $ref: ../schemas/execution-evidence.yaml#/RunEvidence
      default:
        $ref: ../components/api-components.yaml#/responses/Error

path2:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  - name: chunkID
    in: path
    required: true
    schema:
      type: string
      format: uuid
  get:
    operationId: getRunRawOutputChunk
    description: Reads one bounded raw-output chunk after verifying that it belongs to the requested Project and Run.
    responses:
      '200':
        description: Redacted raw process output.
        content:
          text/plain:
            schema:
              type: string
      default:
        $ref: ../components/api-components.yaml#/responses/Error

path3:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  - name: artifactID
    in: path
    required: true
    schema:
      type: string
      format: uuid
  get:
    operationId: getRunArtifact
    description: Downloads one immutable Artifact after verifying that it belongs to the requested Project and Run.
    responses:
      '200':
        description: Artifact content. The response Content-Type is taken from validated Artifact metadata when available.
        content:
          '*/*':
            schema:
              type: string
              format: binary
      default:
        $ref: ../components/api-components.yaml#/responses/Error
