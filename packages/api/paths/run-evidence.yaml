path1:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  get:
    operationId: getRunEvidence
    description: Reconstructs immutable execution evidence for one Project-scoped Run without exposing blob storage references.
    responses:
      '200':
        description: Complete durable Run evidence projection.
        content:
          application/json:
            schema:
              $ref: ../schemas/execution-evidence.yaml#/RunEvidence
      default:
        $ref: ../components/api-components.yaml#/responses/Error

path2:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  - name: chunkID
    in: path
    required: true
    schema:
      type: string
      format: uuid
  get:
    operationId: getRunRawOutputChunk
    description: Reads one bounded raw-output chunk after verifying that it belongs to the requested Project and Run.
    responses:
      '200':
        description: Redacted raw process output.
        content:
          text/plain:
            schema:
              type: string
      default:
        $ref: ../components/api-components.yaml#/responses/Error

path3:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  - name: artifactID
    in: path
    required: true
    schema:
      type: string
      format: uuid
  get:
    operationId: getRunArtifact
    description: Downloads one immutable Artifact after verifying that it belongs to the requested Project and Run.
    responses:
      '200':
        description: Artifact content. The response Content-Type is taken from validated Artifact metadata when available.
        content:
          '*/*':
            schema:
              type: string
              format: binary
      default:
        $ref: ../components/api-components.yaml#/responses/Error

path4:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  get:
    operationId: streamRunEvents
    description: >
      Live Project/Run Event stream. Clients load persisted evidence first, then
      reconnect with afterSequence set to the last observed Event sequence.
      Each SSE data payload is EventEvidence JSON. The SSE id field is the Event
      UUID and is the client idempotency key. afterSequence is the v0.1 reconnect
      cursor and selects Events with sequence greater than the given value.
    parameters:
    - name: afterSequence
      in: query
      description: Reconnect cursor. Only Events with sequence greater than this value are replayed, then live Events are forwarded.
      schema:
        type: integer
        minimum: 0
        default: 0
    responses:
      '200':
        description: Server-Sent Event stream of EventEvidence records.
        content:
          text/event-stream:
            schema:
              type: string
              description: SSE frames. data is EventEvidence JSON; id is the Event UUID.
      default:
        $ref: ../components/api-components.yaml#/responses/Error

path5:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  get:
    operationId: getRunUsage
    description: Returns normalized Run model-usage telemetry reconstructed from durable model.usage Events.
    responses:
      '200':
        description: Current Run model-usage summary, or null when no valid telemetry exists.
        content:
          application/json:
            schema:
              oneOf:
              - $ref: ../schemas/execution-evidence.yaml#/RunUsageEvidence
              - type: 'null'
      default:
        $ref: ../components/api-components.yaml#/responses/Error
