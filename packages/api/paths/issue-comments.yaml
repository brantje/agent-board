comments:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  get:
    operationId: listIssueComments
    description: Lists durable Issue comments and replies in deterministic chronological order.
    responses:
      '200':
        description: Issue comments
        content:
          application/json:
            schema:
              type: array
              items: {$ref: ../schemas/control-plane.yaml#/IssueComment}
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createIssueComment
    description: Creates a human-authored Issue comment or reply. The authenticated User is authoritative; comment text has no execution semantics.
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/control-plane.yaml#/IssueCommentCreate}
    responses:
      '201':
        description: Created Issue comment
        content:
          application/json:
            schema: {$ref: ../schemas/control-plane.yaml#/IssueComment}
      default:
        $ref: ../components/api-components.yaml#/responses/Error

timeline:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  get:
    operationId: listIssueTimeline
    description: Chronological read projection combining durable Issue comments with relevant durable Issue activity while preserving entry type.
    responses:
      '200':
        description: Unified Issue timeline
        content:
          application/json:
            schema:
              type: array
              items: {$ref: ../schemas/control-plane.yaml#/IssueTimelineEntry}
      default:
        $ref: ../components/api-components.yaml#/responses/Error


comment:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  - name: commentID
    in: path
    required: true
    schema: {type: string, format: uuid}
  patch:
    operationId: updateIssueComment
    description: Edits a human-authored Issue comment. Only the original human author may edit it; editing has no execution semantics.
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/control-plane.yaml#/IssueCommentUpdate}
    responses:
      '200':
        description: Updated Issue comment
        content:
          application/json:
            schema: {$ref: ../schemas/control-plane.yaml#/IssueComment}
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  delete:
    operationId: deleteIssueComment
    description: Deletes a leaf comment or tombstones a comment that has replies so discussion structure is preserved.
    responses:
      '204':
        description: Comment deleted or tombstoned
      default:
        $ref: ../components/api-components.yaml#/responses/Error

resolution:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  - name: commentID
    in: path
    required: true
    schema: {type: string, format: uuid}
  put:
    operationId: resolveIssueComment
    description: Idempotently resolves a top-level Issue discussion and records the authenticated resolver.
    responses:
      '200':
        description: Resolved Issue comment
        content:
          application/json:
            schema: {$ref: ../schemas/control-plane.yaml#/IssueComment}
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  delete:
    operationId: reopenIssueComment
    description: Idempotently reopens a resolved top-level Issue discussion.
    responses:
      '200':
        description: Reopened Issue comment
        content:
          application/json:
            schema: {$ref: ../schemas/control-plane.yaml#/IssueComment}
      default:
        $ref: ../components/api-components.yaml#/responses/Error

reaction:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  - name: commentID
    in: path
    required: true
    schema: {type: string, format: uuid}
  - name: reaction
    in: path
    required: true
    schema: {$ref: ../schemas/control-plane.yaml#/IssueCommentReactionKey}
  put:
    operationId: addIssueCommentReaction
    description: Idempotently adds the authenticated User's reaction to a live comment.
    responses:
      '204':
        description: Reaction present
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  delete:
    operationId: removeIssueCommentReaction
    description: Idempotently removes the authenticated User's reaction from a live comment.
    responses:
      '204':
        description: Reaction absent
      default:
        $ref: ../components/api-components.yaml#/responses/Error


discussions:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  get:
    operationId: listRecentIssueDiscussions
    description: Lists recent Issue discussions by thread last activity. Results are bounded and contain top-level roots with reply metadata.
    parameters:
    - name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 20}
    responses:
      '200':
        description: Recent Issue discussions
        content:
          application/json:
            schema:
              type: array
              items: {$ref: ../schemas/control-plane.yaml#/IssueDiscussionRoot}
      default:
        $ref: ../components/api-components.yaml#/responses/Error

thread:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  - name: commentID
    in: path
    required: true
    schema: {type: string, format: uuid}
  get:
    operationId: getIssueDiscussionThread
    description: Resolves any comment anchor to its top-level discussion and returns a bounded coherent thread.
    parameters:
    - name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100}
    responses:
      '200':
        description: Issue discussion thread
        content:
          application/json:
            schema: {$ref: ../schemas/control-plane.yaml#/IssueDiscussionThread}
      default:
        $ref: ../components/api-components.yaml#/responses/Error

updates:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  get:
    operationId: listIssueDiscussionUpdates
    description: Lists comments newer than an opaque durable cursor and restores required ancestor context so replies are never returned orphaned.
    parameters:
    - name: cursor
      in: query
      required: false
      description: Opaque cursor returned by an earlier discussion update read.
      schema: {type: string}
    - name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 50}
    responses:
      '200':
        description: Incremental Issue discussion updates
        content:
          application/json:
            schema: {$ref: ../schemas/control-plane.yaml#/IssueDiscussionUpdates}
      default:
        $ref: ../components/api-components.yaml#/responses/Error
