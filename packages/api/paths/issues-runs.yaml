path1:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  get:
    operationId: listIssues
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/IssueList
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createIssue
    description: Creates an unassigned Issue. Ownership is changed separately through the assignment endpoint, so HTTP Issue creation itself does not automatically queue a Run.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/IssueCreate
    responses:
      '201':
        $ref: ../components/api-components.yaml#/responses/Issue
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path2:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  get:
    operationId: getIssue
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Issue
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  patch:
    operationId: updateIssue
    description: Updates only the supplied Issue fields without cancelling Runs. Board status is explicit. An already Agent-assigned Issue leaving BACKLOG for TODO, IN_PROGRESS, BLOCKED or REVIEW automatically queues a Run when execution configuration is valid. Other status changes do not enqueue. Scheduler availability is evaluated after Run creation.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/IssueUpdate
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Issue
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path3:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  post:
    operationId: assignIssue
    description: Changes ownership and atomically records its Event while preserving Board status and existing Runs. Changed Agent ownership outside BACKLOG queues a Run when execution configuration is valid, suppressing duplicate active Runs for the same Issue and Agent. Invalid execution configuration does not invalidate ownership. User ownership, unassignment and unchanged ownership never enqueue. Scheduler availability is evaluated after Run creation.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/Assignment
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Assignment
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path4:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  get:
    operationId: listRuns
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/RunList
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path5:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  get:
    operationId: getRun
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Run
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path6:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  get:
    operationId: listIssueRelationships
    description: Lists relationships authored from this source Issue in deterministic creation order.
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/IssueRelationshipList
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createIssueRelationship
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/IssueRelationshipCreate
    responses:
      '201':
        $ref: ../components/api-components.yaml#/responses/IssueRelationship
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path7:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  - $ref: ../components/api-components.yaml#/parameters/RelationshipID
  delete:
    operationId: deleteIssueRelationship
    responses:
      '204':
        description: Issue relationship deleted.
      default:
        $ref: ../components/api-components.yaml#/responses/Error

assignees:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  get:
    operationId: listIssueAssignees
    description: Active effective Project members/admins and enabled visible Agents, independent of execution configuration and scheduler availability.
    responses:
      '200':
        description: Eligible Issue owners
        content:
          application/json:
            schema:
              type: array
              items: {$ref: '../schemas/control-plane.yaml#/Assignee'}
      default:
        $ref: ../components/api-components.yaml#/responses/Error

executionState:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  get:
    operationId: getIssueExecutionState
    description: Derived execution eligibility for the current Issue ownership. This does not persist pending execution state.
    responses:
      '200':
        description: Current execution eligibility
        content:
          application/json:
            schema:
              type: object
              required: [state, canStart, activeRun]
              properties:
                state:
                  type: string
                  enum: [BACKLOG, NOT_AGENT_OWNED, CONFIGURATION_UNAVAILABLE, ACTIVE, READY]
                canStart: {type: boolean}
                activeRun:
                  anyOf:
                  - $ref: ../schemas/control-plane.yaml#/Run
                  - type: 'null'
      default:
        $ref: ../components/api-components.yaml#/responses/Error

startRun:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  post:
    operationId: startIssueRun
    description: >-
      Requires Project member authority. Starts work using only the current Agent
      assignee, preserving Issue ownership and Board status. BACKLOG, unassigned,
      User-assigned and invalid execution configuration return conflict. All other
      Board statuses are eligible. Runner/source/capacity availability belongs to
      the scheduler; a queued Run is a successful result. Returns the existing
      active Run for this Issue/Agent on a duplicate request while configuration
      remains valid. Successful creation atomically persists run.created and a START job.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Run
      '409':
        $ref: ../components/api-components.yaml#/responses/Error
      default:
        $ref: ../components/api-components.yaml#/responses/Error
