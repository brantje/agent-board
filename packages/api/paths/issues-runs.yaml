path1:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  get:
    operationId: listIssues
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/IssueList
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createIssue
    description: Initial Agent ownership automatically queues a Run when runnable and outside BACKLOG.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/IssueCreate
    responses:
      '201':
        $ref: ../components/api-components.yaml#/responses/Issue
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path2:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  get:
    operationId: getIssue
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Issue
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  patch:
    operationId: updateIssue
    description: Updates Issue state without cancelling Runs. An already Agent-assigned Issue leaving BACKLOG for TODO, IN_PROGRESS, BLOCKED or REVIEW automatically queues a Run when runnable. Other status changes do not enqueue.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/IssueUpdate
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Issue
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path3:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  post:
    operationId: assignIssue
    description: Changes ownership and atomically records its Event while preserving Board status and existing Runs. Changed Agent ownership outside BACKLOG queues a Run when runnable, suppressing duplicate active Runs for the same Issue and Agent. User ownership, unassignment and unchanged ownership never enqueue.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/Assignment
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Assignment
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path4:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  get:
    operationId: listRuns
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/RunList
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path5:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  get:
    operationId: getRun
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Run
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path6:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  get:
    operationId: listIssueRelationships
    description: Lists relationships authored from this source Issue in deterministic creation order.
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/IssueRelationshipList
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createIssueRelationship
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/IssueRelationshipCreate
    responses:
      '201':
        $ref: ../components/api-components.yaml#/responses/IssueRelationship
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path7:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/IssueID
  - $ref: ../components/api-components.yaml#/parameters/RelationshipID
  delete:
    operationId: deleteIssueRelationship
    responses:
      '204':
        description: Issue relationship deleted.
      default:
        $ref: ../components/api-components.yaml#/responses/Error

assignees:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  get:
    operationId: listIssueAssignees
    description: Active effective Project members/admins and enabled visible Agents, independent of execution readiness.
    responses:
      '200':
        description: Eligible Issue owners
        content:
          application/json:
            schema:
              type: array
              items: {$ref: '../schemas/control-plane.yaml#/Assignee'}
      default:
        $ref: ../components/api-components.yaml#/responses/Error
