path1:
  get:
    operationId: listRuntimes
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/RuntimeList
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createRuntime
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/RuntimeInput
    responses:
      '201':
        $ref: ../components/api-components.yaml#/responses/Runtime
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path2:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ResourceID
  get:
    operationId: getRuntime
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Runtime
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  put:
    operationId: updateRuntime
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/RuntimeInput
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Runtime
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path3:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  get:
    operationId: listProjectRuntimes
    description: Returns Project-owned resources plus visible shared resources.
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/RuntimeList
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createProjectRuntime
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/RuntimeInput
    responses:
      '201':
        $ref: ../components/api-components.yaml#/responses/Runtime
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path4:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/ResourceID
  get:
    operationId: getProjectRuntime
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Runtime
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  put:
    operationId: updateProjectRuntime
    description: Mutates Project-owned resources only; shared resources are read-only in Project scope.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/RuntimeInput
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Runtime
      default:
        $ref: ../components/api-components.yaml#/responses/Error
