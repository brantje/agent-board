parentCollection:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  get:
    operationId: listRunDelegations
    description: Lists durable delegation requests created by the authoritative parent Run.
    responses:
      '200':
        description: Delegation lineage created by this parent Run.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/control-plane.yaml#/Delegation
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createRunDelegation
    description: Requests bounded work from an eligible Agent through the canonical delegation command. The parent Run and its authoritative Agent/Issue are derived from the path and persisted execution context.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/control-plane.yaml#/DelegationCreate
    responses:
      '201':
        description: Accepted durable delegation lineage. Execution state remains authoritative on the linked normal Run and scheduler job.
        content:
          application/json:
            schema:
              $ref: ../schemas/control-plane.yaml#/Delegation
      default:
        $ref: ../components/api-components.yaml#/responses/Error
childResource:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/RunID
  get:
    operationId: getRunDelegation
    description: Returns durable parent lineage for a delegated child Run.
    responses:
      '200':
        description: Delegation lineage for this delegated Run.
        content:
          application/json:
            schema:
              $ref: ../schemas/control-plane.yaml#/Delegation
      default:
        $ref: ../components/api-components.yaml#/responses/Error
