path1:
  get:
    operationId: listAgents
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/AgentList
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createAgent
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/AgentInput
    responses:
      '201':
        $ref: ../components/api-components.yaml#/responses/Agent
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path2:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ResourceID
  get:
    operationId: getAgent
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Agent
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  put:
    operationId: updateAgent
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/AgentInput
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Agent
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path3:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  get:
    operationId: listProjectAgents
    description: Returns Project-owned resources plus visible shared resources.
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/AgentList
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createProjectAgent
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/AgentInput
    responses:
      '201':
        $ref: ../components/api-components.yaml#/responses/Agent
      default:
        $ref: ../components/api-components.yaml#/responses/Error
path4:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/ResourceID
  get:
    operationId: getProjectAgent
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Agent
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  put:
    operationId: updateProjectAgent
    description: Mutates Project-owned resources only; shared resources are read-only in Project scope.
    requestBody:
      $ref: ../components/api-components.yaml#/requestBodies/AgentInput
    responses:
      '200':
        $ref: ../components/api-components.yaml#/responses/Agent
      default:
        $ref: ../components/api-components.yaml#/responses/Error
