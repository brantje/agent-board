projectRunnersResponse:
  description: Dedicated Project runners plus the shared external-runner allowlist and available shared capacity.
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        required: [runnerIds, projectRunners, sharedRunners]
        properties:
          runnerIds:
            type: array
            items: {type: string, format: uuid}
          projectRunners:
            type: array
            items:
              $ref: ../schemas/runners.yaml#/Runner
          sharedRunners:
            type: array
            items:
              $ref: ../schemas/runners.yaml#/Runner
projectRunnersRequest:
  required: true
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        required: [runnerIds]
        properties:
          runnerIds:
            type: array
            items: {type: string, format: uuid}
collection:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  get:
    operationId: getProjectRunners
    responses:
      '200':
        $ref: '#/projectRunnersResponse'
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  put:
    operationId: setProjectRunners
    requestBody:
      $ref: '#/projectRunnersRequest'
    responses:
      '200':
        $ref: '#/projectRunnersResponse'
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  post:
    operationId: createProjectRunner
    responses:
      '201':
        $ref: ./runners.yaml#/creationResponse
      default:
        $ref: ../components/api-components.yaml#/responses/Error
resource:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/ResourceID
  patch:
    operationId: updateProjectRunner
    requestBody:
      $ref: ./runners.yaml#/nameInput
    responses:
      '200':
        $ref: ./runners.yaml#/runnerResponse
      default:
        $ref: ../components/api-components.yaml#/responses/Error
  delete:
    operationId: deleteProjectRunner
    responses:
      '204':
        description: Permanently soft-deleted and revoked. Historical provenance is retained.
      default:
        $ref: ../components/api-components.yaml#/responses/Error
rotate:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/ResourceID
  post:
    operationId: rotateProjectRunnerToken
    responses:
      '200':
        $ref: ./runners.yaml#/credentialResponse
      default:
        $ref: ../components/api-components.yaml#/responses/Error
revoke:
  parameters:
  - $ref: ../components/api-components.yaml#/parameters/ProjectID
  - $ref: ../components/api-components.yaml#/parameters/ResourceID
  post:
    operationId: revokeProjectRunner
    responses:
      '200':
        $ref: ./runners.yaml#/runnerResponse
      default:
        $ref: ../components/api-components.yaml#/responses/Error
