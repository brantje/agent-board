JSONMap:
  type: object
  additionalProperties: true
IssueKey:
  type: string
  description: Public Issue identifier in the form PREFIX-NUMBER, for example AB-12.
  pattern: '^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]*$'
IssuePrefix:
  type: string
  description: Immutable per-Project Issue key prefix. Uppercase letters and digits; 2-10 characters and must start with a letter.
  pattern: '^[A-Z][A-Z0-9]{1,9}$'
Project:
  type: object
  required:
  - id
  - name
  - issuePrefix
  - sourceType
  - cloneUrl
  - sourceRef
  - repositoryPath
  - defaultBranch
  - workflowSettings
  - allowInternalRunner
  - createdAt
  - updatedAt
  properties:
    id: {type: string, format: uuid}
    name: {type: string}
    issuePrefix: {$ref: '#/IssuePrefix'}
    sourceType:
      type: string
      enum: [local, git]
      description: Project source kind. Existing and omitted-source Projects use local.
    cloneUrl:
      type: [string, 'null']
      description: Cloneable Git URL when sourceType is git. Stored without contacting the remote; embedded URI credentials are not allowed.
    sourceRef:
      type: [string, 'null']
      description: Optional branch, tag, or commit for a git source. Null means the remote default branch is resolved at execution time.
    repositoryPath:
      type: string
      description: Backend-visible local repository path when sourceType is local; empty for git sources.
    defaultBranch:
      type: string
      description: Local Project default branch when sourceType is local; empty for git sources.
    workflowSettings: {$ref: '#/JSONMap'}
    allowInternalRunner: {type: boolean}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
ProjectCreate:
  type: object
  additionalProperties: false
  required: [name, issuePrefix]
  oneOf:
    - required: [repositoryPath]
      properties:
        sourceType: {type: string, enum: [local]}
    - required: [sourceType, cloneUrl]
      properties:
        sourceType: {type: string, enum: [git]}
        cloneUrl: {type: string, minLength: 1}
  properties:
    name: {type: string}
    issuePrefix: {$ref: '#/IssuePrefix'}
    sourceType: {type: string, enum: [local, git], default: local}
    cloneUrl: {type: [string, 'null']}
    sourceRef: {type: [string, 'null']}
    repositoryPath: {type: string}
    defaultBranch: {type: string, default: main}
    workflowSettings: {$ref: '#/JSONMap'}
ProjectUpdate:
  type: object
  additionalProperties: false
  properties:
    name: {type: string}
    sourceType: {type: string, enum: [local, git]}
    cloneUrl: {type: [string, 'null']}
    sourceRef: {type: [string, 'null']}
    repositoryPath: {type: string}
    defaultBranch: {type: string}
    workflowSettings: {$ref: '#/JSONMap'}
    allowInternalRunner: {type: boolean}
RepositorySettings:
  type: object
  additionalProperties: false
  required: [defaultRepositoryPath, repositoryRoots]
  properties:
    defaultRepositoryPath: {type: string}
    repositoryRoots:
      type: array
      items: {type: string}
SecretUpsertInput:
  type: object
  additionalProperties: false
  required: [ref, value]
  properties:
    ref: {type: string, minLength: 1}
    value: {type: string, minLength: 1, writeOnly: true}
SecretMetadata:
  type: object
  description: Safe metadata for a stored secret. Plaintext is never returned.
  required: [ref, projectId]
  properties:
    ref: {type: string}
    projectId: {type: [string, 'null'], format: uuid}
Provider:
  type: object
  description: Credential references are write-only and are never returned.
  required: [id, projectId, name, kind, baseUrl, enabled, healthStatus, safeMetadata, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: [string, 'null'], format: uuid}
    name: {type: string}
    kind: {type: string}
    baseUrl: {type: [string, 'null']}
    enabled: {type: boolean}
    healthStatus: {type: string, enum: [UNKNOWN, HEALTHY, UNHEALTHY]}
    filteredModelCount: {type: [integer, 'null'], minimum: 0}
    totalModelCount: {type: [integer, 'null'], minimum: 0}
    safeMetadata: {$ref: '#/JSONMap'}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
ProviderInput:
  type: object
  additionalProperties: false
  required: [name, kind]
  properties:
    name: {type: string}
    kind: {type: string}
    baseUrl: {type: [string, 'null']}
    credentialRef: {type: [string, 'null'], writeOnly: true}
    credential: {type: string, minLength: 1, writeOnly: true}
    enabled: {type: boolean, default: true}
    safeMetadata: {$ref: '#/JSONMap'}
ProviderModel:
  type: object
  required: [id]
  properties:
    id: {type: string}
    name: {type: [string, 'null']}
ProviderModelList:
  type: object
  required: [models, total]
  properties:
    models:
      type: array
      items: {$ref: '#/ProviderModel'}
    total: {type: integer, minimum: 0}
ModelProfile:
  type: object
  required: [id, projectId, providerId, name, model, temperature, maxTokens, maxConcurrent, enabled, generationSettings, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: [string, 'null'], format: uuid}
    providerId: {type: string, format: uuid}
    name: {type: string}
    model: {type: string}
    temperature: {type: [number, 'null'], minimum: 0, maximum: 2}
    maxTokens: {type: [integer, 'null'], minimum: 1}
    maxConcurrent: {type: [integer, 'null'], minimum: 1}
    generationSettings: {$ref: '#/JSONMap'}
    enabled: {type: boolean}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
ModelProfileInput:
  type: object
  additionalProperties: false
  required: [providerId, name, model]
  properties:
    providerId: {type: string, format: uuid}
    name: {type: string}
    model: {type: string}
    temperature: {type: [number, 'null'], minimum: 0, maximum: 2}
    maxTokens: {type: [integer, 'null'], minimum: 1}
    maxConcurrent: {type: [integer, 'null'], minimum: 1}
    generationSettings: {$ref: '#/JSONMap'}
    enabled: {type: boolean, default: true}
Runtime:
  type: object
  required: [id, projectId, name, kind, image, cpuLimitMillis, memoryLimitBytes, pidLimit, timeoutSeconds, networkPolicy, workspacePolicy, allowedSecretRefs, capabilities, enabled, healthStatus, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: [string, 'null'], format: uuid}
    name: {type: string}
    kind: {type: string, enum: [docker]}
    image: {type: string}
    cpuLimitMillis: {type: [integer, 'null'], minimum: 1}
    memoryLimitBytes: {type: [integer, 'null'], minimum: 1}
    pidLimit: {type: [integer, 'null'], minimum: 1}
    timeoutSeconds: {type: [integer, 'null'], minimum: 1}
    networkPolicy: {type: string, enum: [none, restricted, outbound]}
    workspacePolicy: {type: string, enum: [issue]}
    allowedSecretRefs: {type: array, items: {type: string}}
    capabilities: {$ref: '#/JSONMap'}
    enabled: {type: boolean}
    healthStatus: {type: string, enum: [UNKNOWN, HEALTHY, UNHEALTHY]}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
RuntimeInput:
  type: object
  additionalProperties: false
  required: [name, kind, image, networkPolicy]
  properties:
    name: {type: string}
    kind: {type: string, enum: [docker]}
    image: {type: string}
    cpuLimitMillis: {type: [integer, 'null'], minimum: 1}
    memoryLimitBytes: {type: [integer, 'null'], minimum: 1}
    pidLimit: {type: [integer, 'null'], minimum: 1}
    timeoutSeconds: {type: [integer, 'null'], minimum: 1}
    networkPolicy: {type: string, enum: [none, restricted, outbound]}
    allowedSecretRefs: {type: array, items: {type: string}}
    capabilities: {$ref: '#/JSONMap'}
    enabled: {type: boolean, default: true}
Agent:
  type: object
  required: [id, projectId, name, roleInstructions, engine, modelProfileId, engineSettings, concurrencyLimit, allowDelegation, state, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: [string, 'null'], format: uuid}
    name: {type: string}
    roleInstructions: {type: string}
    engine: {type: string}
    modelProfileId: {type: string, format: uuid}
    engineSettings: {$ref: '#/JSONMap'}
    concurrencyLimit: {type: integer, minimum: 1}
    allowDelegation:
      type: boolean
      description: Whether authoritative Runs for this Agent receive the trusted delegation capability.
    state: {type: string, enum: [DRAFT, ENABLED, DISABLED, ARCHIVED]}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
AgentInput:
  type: object
  additionalProperties: false
  required: [name, engine, modelProfileId]
  properties:
    name: {type: string}
    roleInstructions: {type: string}
    engine: {type: string}
    modelProfileId: {type: string, format: uuid}
    engineSettings: {$ref: '#/JSONMap'}
    concurrencyLimit: {type: integer, minimum: 1, default: 1}
    allowDelegation:
      type: boolean
      default: false
      description: Allow this Agent's authoritative Runs to delegate bounded work to eligible Agents.
    state: {type: string, enum: [DRAFT, ENABLED, DISABLED, ARCHIVED], default: ENABLED}
IssueCreator:
  type: object
  additionalProperties: false
  required: [type, id, name]
  properties:
    type: {type: string, enum: [HUMAN, AGENT]}
    id: {type: string, format: uuid}
    name: {type: [string, 'null']}
Issue:
  type: object
  required: [id, projectId, number, title, description, status, priority, assignedTo, createdBy, createdAt, updatedAt, lastEvent]
  properties:
    id: {$ref: '#/IssueKey'}
    projectId: {type: string, format: uuid}
    number: {type: integer, minimum: 1}
    title: {type: string}
    description: {type: string}
    status: {type: string, enum: [BACKLOG, TODO, IN_PROGRESS, BLOCKED, REVIEW, DONE]}
    priority:
      type: integer
      minimum: 0
      maximum: 4
      description: Numeric v0.1 priority. 0 is the default/base priority and larger values mean higher relative priority.
    assignedTo:
      oneOf:
      - {$ref: '#/Assignee'}
      - {type: 'null'}
    createdBy:
      oneOf:
        - $ref: '#/IssueCreator'
        - type: 'null'
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
    currentBranch:
      type: [string, 'null']
      description: Live Issue Workspace Git checkout. Null when no Workspace exists yet.
    lastEvent:
      description: Latest Issue, Run, Question, Review, or Decision Event for this Issue. Tool and agent.message chatter is excluded.
      oneOf:
        - $ref: ./execution-evidence.yaml#/EventEvidence
        - type: 'null'
IssueCreate:
  type: object
  additionalProperties: false
  required: [title]
  properties:
    title: {type: string}
    description: {type: string}
    status: {type: string, enum: [BACKLOG, TODO, IN_PROGRESS, BLOCKED, REVIEW, DONE], default: BACKLOG}
    priority:
      type: integer
      minimum: 0
      maximum: 4
      default: 0
      description: Numeric v0.1 priority. 0 is the default/base priority and larger values mean higher relative priority.
IssueUpdate:
  type: object
  additionalProperties: false
  properties:
    title: {type: string}
    description: {type: string}
    status: {type: string, enum: [BACKLOG, TODO, IN_PROGRESS, BLOCKED, REVIEW, DONE]}
    priority:
      type: integer
      minimum: 0
      maximum: 4
      description: Numeric v0.1 priority. 0 is the default/base priority and larger values mean higher relative priority.
IssueCommentAuthor:
  type: object
  additionalProperties: false
  required: [type, id, name]
  properties:
    type: {type: string, enum: [HUMAN, AGENT]}
    id: {type: string, format: uuid}
    name: {type: string}
IssueCommentResolver:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id: {type: string, format: uuid}
    name: {type: string}
IssueCommentReactionKey:
  type: string
  enum: [THUMBS_UP, THUMBS_DOWN, LAUGH, HOORAY, CONFUSED, HEART, ROCKET, EYES]
IssueCommentReactionSummary:
  type: object
  additionalProperties: false
  required: [reaction, count, reactedByCurrentUser]
  properties:
    reaction: {$ref: '#/IssueCommentReactionKey'}
    count: {type: integer, minimum: 1}
    reactedByCurrentUser: {type: boolean}
IssueCommentMentionOutcome:
  type: string
  enum: [QUEUED, COALESCED, DEFERRED, BLOCKED]
IssueCommentMention:
  type: object
  additionalProperties: false
  required: [id, targetType, targetId, targetName, resolvedAgentId, resolvedAgentName, targetAgentId, targetAgentName, outcome, reasonCode, delegationId, delegatedRunId]
  properties:
    id: {type: string, format: uuid}
    targetType: {type: string, enum: [AGENT, SQUAD]}
    targetId: {type: string, format: uuid}
    targetName: {type: string}
    resolvedAgentId: {type: [string, 'null'], format: uuid}
    resolvedAgentName: {type: string}
    targetAgentId: {type: string, format: uuid}
    targetAgentName: {type: string}
    outcome: {$ref: '#/IssueCommentMentionOutcome'}
    reasonCode: {type: [string, 'null'], enum: [TARGET_UNAVAILABLE, TARGET_BUSY, DELEGATION_BLOCKED, null]}
    delegationId: {type: [string, 'null'], format: uuid}
    delegatedRunId: {type: [string, 'null'], format: uuid}
IssueCommentMentionPreview:
  type: object
  additionalProperties: false
  required: [targetType, targetId, targetName, resolvedAgentId, resolvedAgentName, targetAgentId, targetAgentName, eligible, reasonCode]
  properties:
    targetType: {type: string, enum: [AGENT, SQUAD]}
    targetId: {type: string, format: uuid}
    targetName: {type: string}
    resolvedAgentId: {type: [string, 'null'], format: uuid}
    resolvedAgentName: {type: string}
    targetAgentId: {type: string, format: uuid}
    targetAgentName: {type: string}
    eligible: {type: boolean}
    reasonCode: {type: [string, 'null'], enum: [TARGET_UNAVAILABLE, TARGET_BUSY, DELEGATION_BLOCKED, null]}
IssueCommentMentionPreviewInput:
  type: object
  additionalProperties: false
  required: []
  properties:
    mentionTargets:
      type: array
      maxItems: 10
      items:
        type: object
        required: [type, id]
        properties:
          type: {type: string, enum: [AGENT, SQUAD]}
          id: {type: string, format: uuid}
    mentionAgentIds:
      type: array
      maxItems: 10
      uniqueItems: true
      items: {type: string, format: uuid}
IssueCommentImplicitRoutingReason:
  type: string
  enum: [DIRECT_AGENT_REPLY, UNIQUE_THREAD_AGENT, ISSUE_ASSIGNEE, ISSUE_SQUAD_ASSIGNEE]
IssueCommentImplicitOutcome:
  type: string
  enum: [QUEUED, COALESCED, DEFERRED, BLOCKED, SUPPRESSED]
IssueCommentImplicitReasonCode:
  type: [string, 'null']
  enum: [TARGET_UNAVAILABLE, TARGET_BUSY, DELEGATION_BLOCKED, WORKFLOW_BLOCKED, null]
IssueCommentImplicitTrigger:
  type: object
  additionalProperties: false
  required: [targetType, targetId, targetName, resolvedAgentId, resolvedAgentName, targetAgentId, targetAgentName, routingReason, outcome, reasonCode, delegationId, delegatedRunId]
  properties:
    targetType: {type: string, enum: [AGENT, SQUAD]}
    targetId: {type: string, format: uuid}
    targetName: {type: string}
    resolvedAgentId: {type: [string, 'null'], format: uuid}
    resolvedAgentName: {type: string}
    targetAgentId: {type: string, format: uuid}
    targetAgentName: {type: string}
    routingReason: {$ref: '#/IssueCommentImplicitRoutingReason'}
    outcome: {$ref: '#/IssueCommentImplicitOutcome'}
    reasonCode: {$ref: '#/IssueCommentImplicitReasonCode'}
    delegationId: {type: [string, 'null'], format: uuid}
    delegatedRunId: {type: [string, 'null'], format: uuid}
IssueCommentImplicitTriggerPreview:
  type: object
  additionalProperties: false
  required: [targetType, targetId, targetName, resolvedAgentId, resolvedAgentName, targetAgentId, targetAgentName, routingReason, eligible, suppressed, reasonCode]
  properties:
    targetType: {type: string, enum: [AGENT, SQUAD]}
    targetId: {type: string, format: uuid}
    targetName: {type: string}
    resolvedAgentId: {type: [string, 'null'], format: uuid}
    resolvedAgentName: {type: string}
    targetAgentId: {type: string, format: uuid}
    targetAgentName: {type: string}
    routingReason: {$ref: '#/IssueCommentImplicitRoutingReason'}
    eligible: {type: boolean}
    suppressed: {type: boolean}
    reasonCode: {$ref: '#/IssueCommentImplicitReasonCode'}
IssueCommentTriggerPreview:
  type: object
  additionalProperties: false
  required: [mentions, implicit]
  properties:
    mentions:
      type: array
      items: {$ref: '#/IssueCommentMentionPreview'}
    implicit:
      oneOf:
      - {$ref: '#/IssueCommentImplicitTriggerPreview'}
      - {type: 'null'}
IssueCommentTriggerPreviewInput:
  type: object
  additionalProperties: false
  properties:
    parentCommentId: {type: [string, 'null'], format: uuid}
    body: {type: string}
    mentionTargets:
      type: array
      maxItems: 10
      items:
        type: object
        required: [type, id]
        properties:
          type: {type: string, enum: [AGENT, SQUAD]}
          id: {type: string, format: uuid}
    mentionAgentIds:
      type: array
      maxItems: 10
      uniqueItems: true
      items: {type: string, format: uuid}
    suppressImplicitAgentTrigger: {type: boolean, default: false}
IssueComment:
  type: object
  additionalProperties: false
  required: [id, issueId, parentCommentId, sourceRunId, author, body, deletedAt, resolvedAt, resolvedBy, reactions, mentions, implicitTrigger, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    issueId: {$ref: '#/IssueKey'}
    parentCommentId: {type: [string, 'null'], format: uuid}
    sourceRunId:
      type: [string, 'null']
      format: uuid
      description: Authoritative source Run for Agent-authored comments; null for human comments.
    author: {$ref: '#/IssueCommentAuthor'}
    body: {type: [string, 'null']}
    deletedAt: {type: [string, 'null'], format: date-time}
    resolvedAt: {type: [string, 'null'], format: date-time}
    resolvedBy:
      oneOf:
      - {$ref: '#/IssueCommentResolver'}
      - {type: 'null'}
    reactions:
      type: array
      items: {$ref: '#/IssueCommentReactionSummary'}
    mentions:
      type: array
      items: {$ref: '#/IssueCommentMention'}
    implicitTrigger:
      oneOf:
      - {$ref: '#/IssueCommentImplicitTrigger'}
      - {type: 'null'}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
IssueCommentCreate:
  type: object
  additionalProperties: false
  required: [body, requestId]
  properties:
    parentCommentId: {type: [string, 'null'], format: uuid}
    body:
      type: string
      minLength: 1
      pattern: '\S'
    requestId:
      type: string
      format: uuid
      description: Stable client request identity used to make comment creation and any resulting Agent trigger idempotent.
    mentionTargets:
      type: array
      maxItems: 10
      items:
        type: object
        required: [type, id]
        properties:
          type: {type: string, enum: [AGENT, SQUAD]}
          id: {type: string, format: uuid}
    mentionAgentIds:
      type: array
      maxItems: 10
      uniqueItems: true
      items: {type: string, format: uuid}
    suppressImplicitAgentTrigger:
      type: boolean
      default: false
      description: Suppresses only the implicit Agent trigger for this comment. Explicit structured mentions remain explicit requests.
IssueCommentUpdate:
  type: object
  additionalProperties: false
  required: [body]
  properties:
    body:
      type: string
      minLength: 1
      pattern: '\S'
IssueDiscussionRoot:
  type: object
  additionalProperties: false
  required: [root, replyCount, lastActivityAt, compactComments, truncated]
  properties:
    root: {$ref: '#/IssueComment'}
    replyCount:
      type: integer
      minimum: 0
      description: Exact when truncated is false. When truncated is true, this is a lower bound from the bounded traversal, never an implied exact total.
    lastActivityAt:
      type: string
      format: date-time
      description: Exact latest activity timestamp for this returned discussion root.
    compactComments:
      type: array
      description: For resolved discussions, a bounded root-to-latest-activity path. Empty for unresolved discussions; this is a read projection, not a durable AI summary.
      items: {$ref: '#/IssueComment'}
    truncated:
      type: boolean
      description: True when descendants exist beyond the bounded depth or cardinality used for orientation; replyCount is then a lower bound.

IssueDiscussionThread:
  type: object
  additionalProperties: false
  required: [rootId, anchorId, comments, truncated]
  properties:
    rootId: {type: string, format: uuid}
    anchorId: {type: string, format: uuid}
    comments:
      type: array
      items: {$ref: '#/IssueComment'}
    truncated:
      type: boolean
      description: True when the thread contains more descendants than the bounded response includes.

IssueDiscussionUpdateItem:
  type: object
  additionalProperties: false
  required: [comment, isNew, contextTruncated]
  properties:
    comment: {$ref: '#/IssueComment'}
    isNew:
      type: boolean
      description: True for a comment newer than the supplied cursor; false for restored ancestor context.
    contextTruncated:
      type: boolean
      description: True when the bounded update page cannot restore this comment's complete ancestor chain. The canonical comment is returned deliberately as partial context so the durable cursor can advance without silently skipping it.

IssueDiscussionUpdates:
  type: object
  additionalProperties: false
  required: [comments, nextCursor, hasMore]
  properties:
    comments:
      type: array
      items: {$ref: '#/IssueDiscussionUpdateItem'}
    nextCursor:
      type: [string, 'null']
      description: Opaque durable cursor covering only new comments actually returned by this response.
    hasMore:
      type: boolean
      description: True when additional new comments remain after the bounded response.

IssueTimelineEntry:
  type: object
  additionalProperties: false
  required: [kind, id, occurredAt, comment, activity]
  properties:
    kind: {type: string, enum: [comment, activity]}
    id: {type: string, format: uuid}
    occurredAt: {type: string, format: date-time}
    comment:
      oneOf:
      - {$ref: '#/IssueComment'}
      - {type: 'null'}
    activity:
      oneOf:
      - {$ref: ./execution-evidence.yaml#/EventEvidence}
      - {type: 'null'}
IssueRelationship:
  type: object
  description: Project-scoped directed source-to-target Issue relationship. No inverse row is synthesized and the relationship does not itself mutate workflow state.
  required: [id, projectId, sourceIssueId, targetIssueId, type, createdAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: string, format: uuid}
    sourceIssueId: {$ref: '#/IssueKey'}
    targetIssueId: {$ref: '#/IssueKey'}
    type:
      type: string
      enum: [blocks, depends_on, related_to, duplicates]
      description: "Source-to-target meaning: blocks = source blocks target; depends_on = source depends on target; related_to = source records target as related; duplicates = source declares itself a duplicate of target."
    createdAt: {type: string, format: date-time}
IssueRelationshipCreate:
  type: object
  description: Creates one directed source-to-target relationship. Source is the Issue in the request path; the server does not synthesize an inverse relationship.
  additionalProperties: false
  required: [targetIssueId, type]
  properties:
    targetIssueId: {$ref: '#/IssueKey'}
    type:
      type: string
      enum: [blocks, depends_on, related_to, duplicates]
      description: "Source-to-target meaning: blocks = source blocks target; depends_on = source depends on target; related_to = source records target as related; duplicates = source declares itself a duplicate of target."
Run:
  type: object
  required: [id, projectId, issueId, workspaceId, agentId, attempt, status, queueReason, failureReason, createdAt, startedAt, completedAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: string, format: uuid}
    issueId: {$ref: '#/IssueKey'}
    workspaceId: {type: string, format: uuid}
    agentId: {type: [string, 'null'], format: uuid}
    attempt: {type: integer, minimum: 1}
    status: {type: string, enum: [QUEUED, STARTING, RUNNING, WAITING_FOR_INPUT, PAUSED, READY_FOR_REVIEW, COMPLETED, FAILED, CANCELLED]}
    queueReason: {type: [string, 'null']}
    failureReason: {type: [string, 'null']}
    createdAt: {type: string, format: date-time}
    startedAt: {type: [string, 'null'], format: date-time}
    completedAt: {type: [string, 'null'], format: date-time}
    updatedAt: {type: string, format: date-time}
    currentBranch:
      type: [string, 'null']
      description: Live Issue Workspace Git checkout for this Run.
Delegation:
  type: object
  additionalProperties: false
