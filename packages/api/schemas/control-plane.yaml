JSONMap:
  type: object
  additionalProperties: true
IssueKey:
  type: string
  description: Public Issue identifier in the form PREFIX-NUMBER, for example AB-12.
  pattern: '^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]*$'
IssuePrefix:
  type: string
  description: Immutable per-Project Issue key prefix. Uppercase letters and digits; 2-10 characters and must start with a letter.
  pattern: '^[A-Z][A-Z0-9]{1,9}$'
Project:
  type: object
  required:
  - id
  - name
  - issuePrefix
  - sourceType
  - cloneUrl
  - sourceRef
  - repositoryPath
  - defaultBranch
  - workflowSettings
  - allowInternalRunner
  - createdAt
  - updatedAt
  properties:
    id: {type: string, format: uuid}
    name: {type: string}
    issuePrefix: {$ref: '#/IssuePrefix'}
    sourceType:
      type: string
      enum: [local, git]
      description: Project source kind. Existing and omitted-source Projects use local.
    cloneUrl:
      type: [string, 'null']
      description: Cloneable Git URL when sourceType is git. Stored without contacting the remote; embedded URI credentials are not allowed.
    sourceRef:
      type: [string, 'null']
      description: Optional branch, tag, or commit for a git source. Null means the remote default branch is resolved at execution time.
    repositoryPath:
      type: string
      description: Backend-visible local repository path when sourceType is local; empty for git sources.
    defaultBranch:
      type: string
      description: Local Project default branch when sourceType is local; empty for git sources.
    workflowSettings: {$ref: '#/JSONMap'}
    allowInternalRunner: {type: boolean}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
ProjectCreate:
  type: object
  additionalProperties: false
  required: [name, issuePrefix]
  oneOf:
    - required: [repositoryPath]
      properties:
        sourceType: {type: string, enum: [local]}
    - required: [sourceType, cloneUrl]
      properties:
        sourceType: {type: string, enum: [git]}
        cloneUrl: {type: string, minLength: 1}
  properties:
    name: {type: string}
    issuePrefix: {$ref: '#/IssuePrefix'}
    sourceType: {type: string, enum: [local, git], default: local}
    cloneUrl: {type: [string, 'null']}
    sourceRef: {type: [string, 'null']}
    repositoryPath: {type: string}
    defaultBranch: {type: string, default: main}
    workflowSettings: {$ref: '#/JSONMap'}
ProjectUpdate:
  type: object
  additionalProperties: false
  properties:
    name: {type: string}
    sourceType: {type: string, enum: [local, git]}
    cloneUrl: {type: [string, 'null']}
    sourceRef: {type: [string, 'null']}
    repositoryPath: {type: string}
    defaultBranch: {type: string}
    workflowSettings: {$ref: '#/JSONMap'}
    allowInternalRunner: {type: boolean}
RepositorySettings:
  type: object
  additionalProperties: false
  required: [defaultRepositoryPath, repositoryRoots]
  properties:
    defaultRepositoryPath: {type: string}
    repositoryRoots:
      type: array
      items: {type: string}
SecretUpsertInput:
  type: object
  additionalProperties: false
  required: [ref, value]
  properties:
    ref: {type: string, minLength: 1}
    value: {type: string, minLength: 1, writeOnly: true}
SecretMetadata:
  type: object
  description: Safe metadata for a stored secret. Plaintext is never returned.
  required: [ref, projectId]
  properties:
    ref: {type: string}
    projectId: {type: [string, 'null'], format: uuid}
Provider:
  type: object
  description: Credential references are write-only and are never returned.
  required: [id, projectId, name, kind, baseUrl, enabled, healthStatus, safeMetadata, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: [string, 'null'], format: uuid}
    name: {type: string}
    kind: {type: string}
    baseUrl: {type: [string, 'null']}
    enabled: {type: boolean}
    healthStatus: {type: string, enum: [UNKNOWN, HEALTHY, UNHEALTHY]}
    filteredModelCount: {type: [integer, 'null'], minimum: 0}
    totalModelCount: {type: [integer, 'null'], minimum: 0}
    safeMetadata: {$ref: '#/JSONMap'}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
ProviderInput:
  type: object
  additionalProperties: false
  required: [name, kind]
  properties:
    name: {type: string}
    kind: {type: string}
    baseUrl: {type: [string, 'null']}
    credentialRef: {type: [string, 'null'], writeOnly: true}
    credential: {type: string, minLength: 1, writeOnly: true}
    enabled: {type: boolean, default: true}
    safeMetadata: {$ref: '#/JSONMap'}
ProviderModel:
  type: object
  required: [id]
  properties:
    id: {type: string}
    name: {type: [string, 'null']}
ProviderModelList:
  type: object
  required: [models, total]
  properties:
    models:
      type: array
      items: {$ref: '#/ProviderModel'}
    total: {type: integer, minimum: 0}
ModelProfile:
  type: object
  required: [id, projectId, providerId, name, model, temperature, maxTokens, maxConcurrent, enabled, generationSettings, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: [string, 'null'], format: uuid}
    providerId: {type: string, format: uuid}
    name: {type: string}
    model: {type: string}
    temperature: {type: [number, 'null'], minimum: 0, maximum: 2}
    maxTokens: {type: [integer, 'null'], minimum: 1}
    maxConcurrent: {type: [integer, 'null'], minimum: 1}
    generationSettings: {$ref: '#/JSONMap'}
    enabled: {type: boolean}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
ModelProfileInput:
  type: object
  additionalProperties: false
  required: [providerId, name, model]
  properties:
    providerId: {type: string, format: uuid}
    name: {type: string}
    model: {type: string}
    temperature: {type: [number, 'null'], minimum: 0, maximum: 2}
    maxTokens: {type: [integer, 'null'], minimum: 1}
    maxConcurrent: {type: [integer, 'null'], minimum: 1}
    generationSettings: {$ref: '#/JSONMap'}
    enabled: {type: boolean, default: true}
Runtime:
  type: object
  required: [id, projectId, name, kind, image, cpuLimitMillis, memoryLimitBytes, pidLimit, timeoutSeconds, networkPolicy, workspacePolicy, allowedSecretRefs, capabilities, enabled, healthStatus, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: [string, 'null'], format: uuid}
    name: {type: string}
    kind: {type: string, enum: [docker]}
    image: {type: string}
    cpuLimitMillis: {type: [integer, 'null'], minimum: 1}
    memoryLimitBytes: {type: [integer, 'null'], minimum: 1}
    pidLimit: {type: [integer, 'null'], minimum: 1}
    timeoutSeconds: {type: [integer, 'null'], minimum: 1}
    networkPolicy: {type: string, enum: [none, restricted, outbound]}
    workspacePolicy: {type: string, enum: [issue]}
    allowedSecretRefs: {type: array, items: {type: string}}
    capabilities: {$ref: '#/JSONMap'}
    enabled: {type: boolean}
    healthStatus: {type: string, enum: [UNKNOWN, HEALTHY, UNHEALTHY]}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
RuntimeInput:
  type: object
  additionalProperties: false
  required: [name, kind, image, networkPolicy]
  properties:
    name: {type: string}
    kind: {type: string, enum: [docker]}
    image: {type: string}
    cpuLimitMillis: {type: [integer, 'null'], minimum: 1}
    memoryLimitBytes: {type: [integer, 'null'], minimum: 1}
    pidLimit: {type: [integer, 'null'], minimum: 1}
    timeoutSeconds: {type: [integer, 'null'], minimum: 1}
    networkPolicy: {type: string, enum: [none, restricted, outbound]}
    allowedSecretRefs: {type: array, items: {type: string}}
    capabilities: {$ref: '#/JSONMap'}
    enabled: {type: boolean, default: true}
Agent:
  type: object
  required: [id, projectId, name, roleInstructions, engine, modelProfileId, engineSettings, concurrencyLimit, state, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: [string, 'null'], format: uuid}
    name: {type: string}
    roleInstructions: {type: string}
    engine: {type: string}
    modelProfileId: {type: string, format: uuid}
    engineSettings: {$ref: '#/JSONMap'}
    concurrencyLimit: {type: integer, minimum: 1}
    state: {type: string, enum: [DRAFT, ENABLED, DISABLED, ARCHIVED]}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
AgentInput:
  type: object
  additionalProperties: false
  required: [name, engine, modelProfileId]
  properties:
    name: {type: string}
    roleInstructions: {type: string}
    engine: {type: string}
    modelProfileId: {type: string, format: uuid}
    engineSettings: {$ref: '#/JSONMap'}
    concurrencyLimit: {type: integer, minimum: 1, default: 1}
    state: {type: string, enum: [DRAFT, ENABLED, DISABLED, ARCHIVED], default: ENABLED}
Issue:
  type: object
  required: [id, projectId, number, title, description, status, priority, assignedAgentId, createdAt, updatedAt, lastEvent]
  properties:
    id: {$ref: '#/IssueKey'}
    projectId: {type: string, format: uuid}
    number: {type: integer, minimum: 1}
    title: {type: string}
    description: {type: string}
    status: {type: string, enum: [BACKLOG, TODO, IN_PROGRESS, BLOCKED, REVIEW, DONE]}
    priority:
      type: integer
      minimum: 0
      maximum: 4
      description: Numeric v0.1 priority. 0 is the default/base priority and larger values mean higher relative priority.
    assignedAgentId: {type: [string, 'null'], format: uuid}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
    currentBranch:
      type: [string, 'null']
      description: Live Issue Workspace Git checkout. Null when no Workspace exists yet.
    lastEvent:
      description: Latest Issue, Run, Question, Review, or Decision Event for this Issue. Tool and agent.message chatter is excluded.
      oneOf:
        - $ref: ./execution-evidence.yaml#/EventEvidence
        - type: 'null'
IssueCreate:
  type: object
  additionalProperties: false
  required: [title]
  properties:
    title: {type: string}
    description: {type: string}
    status: {type: string, enum: [BACKLOG, TODO, IN_PROGRESS, BLOCKED, REVIEW, DONE], default: BACKLOG}
    priority:
      type: integer
      minimum: 0
      maximum: 4
      default: 0
      description: Numeric v0.1 priority. 0 is the default/base priority and larger values mean higher relative priority.
IssueUpdate:
  type: object
  additionalProperties: false
  properties:
    title: {type: string}
    description: {type: string}
    status: {type: string, enum: [BACKLOG, TODO, IN_PROGRESS, BLOCKED, REVIEW, DONE]}
    priority:
      type: integer
      minimum: 0
      maximum: 4
      description: Numeric v0.1 priority. 0 is the default/base priority and larger values mean higher relative priority.
IssueRelationship:
  type: object
  description: Project-scoped directed source-to-target Issue relationship. No inverse row is synthesized and the relationship does not itself mutate workflow state.
  required: [id, projectId, sourceIssueId, targetIssueId, type, createdAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: string, format: uuid}
    sourceIssueId: {$ref: '#/IssueKey'}
    targetIssueId: {$ref: '#/IssueKey'}
    type:
      type: string
      enum: [blocks, depends_on, related_to, duplicates]
      description: "Source-to-target meaning: blocks = source blocks target; depends_on = source depends on target; related_to = source records target as related; duplicates = source declares itself a duplicate of target."
    createdAt: {type: string, format: date-time}
IssueRelationshipCreate:
  type: object
  description: Creates one directed source-to-target relationship. Source is the Issue in the request path; the server does not synthesize an inverse relationship.
  additionalProperties: false
  required: [targetIssueId, type]
  properties:
    targetIssueId: {$ref: '#/IssueKey'}
    type:
      type: string
      enum: [blocks, depends_on, related_to, duplicates]
      description: "Source-to-target meaning: blocks = source blocks target; depends_on = source depends on target; related_to = source records target as related; duplicates = source declares itself a duplicate of target."
Run:
  type: object
  required: [id, projectId, issueId, workspaceId, agentId, attempt, status, queueReason, failureReason, createdAt, startedAt, completedAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    projectId: {type: string, format: uuid}
    issueId: {$ref: '#/IssueKey'}
    workspaceId: {type: string, format: uuid}
    agentId: {type: [string, 'null'], format: uuid}
    attempt: {type: integer, minimum: 1}
    status: {type: string, enum: [QUEUED, STARTING, RUNNING, WAITING_FOR_INPUT, PAUSED, READY_FOR_REVIEW, COMPLETED, FAILED, CANCELLED]}
    queueReason: {type: [string, 'null']}
    failureReason: {type: [string, 'null']}
    createdAt: {type: string, format: date-time}
    startedAt: {type: [string, 'null'], format: date-time}
    completedAt: {type: [string, 'null'], format: date-time}
    updatedAt: {type: string, format: date-time}
    currentBranch:
      type: [string, 'null']
      description: Live Issue Workspace Git checkout for this Run.
AssignmentInput:
  type: object
  additionalProperties: false
  required: [agentId]
  properties:
    agentId: {type: string, format: uuid}
AssignmentResponse:
  type: object
  required: [issue, run]
  properties:
    issue: {$ref: '#/Issue'}
    run: {$ref: '#/Run'}
ErrorResponse:
  type: object
  required: [error]
  properties:
    error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
