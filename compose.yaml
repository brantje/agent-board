name: agent-board

services:
  credential-init:
    image: alpine:3.22
    command:
      - /bin/sh
      - -ec
      - |
        credential_file=/run/agent-board/postgres-password
        if [ ! -s "$$credential_file" ]; then
          umask 077
          dd if=/dev/urandom bs=32 count=1 2>/dev/null | od -An -tx1 | tr -d ' \n' > "$$credential_file"
        fi
        chmod 0444 "$$credential_file"
    volumes:
      - postgres-credentials:/run/agent-board
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_board}
      POSTGRES_USER: ${POSTGRES_USER:-agent_board}
      POSTGRES_PASSWORD_FILE: /run/agent-board/postgres-password
    depends_on:
      credential-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-credentials:/run/agent-board:ro
      - ./packages/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      AGENT_BOARD_SERVER_ADDR: :3001
      POSTGRES_DB: ${POSTGRES_DB:-agent_board}
      POSTGRES_USER: ${POSTGRES_USER:-agent_board}
      AGENT_BOARD_WORKSPACE_ROOT: ${AGENT_BOARD_WORKSPACE_ROOT:-/var/lib/agent-board/workspaces}
      AGENT_BOARD_REPOSITORY_ROOTS: ${AGENT_BOARD_REPOSITORY_ROOTS:-${AGENT_BOARD_REPOSITORY_MOUNT_PATH:-/repositories}}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        password="$$(cat /run/agent-board/postgres-password)"
        export AGENT_BOARD_DATABASE_URL="postgres://$${POSTGRES_USER}:$${password}@postgres:5432/$${POSTGRES_DB}?sslmode=disable"
        exec /usr/local/bin/agent-board-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AGENT_BOARD_SERVER_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ${AGENT_BOARD_WORKSPACE_ROOT:-/var/lib/agent-board/workspaces}:${AGENT_BOARD_WORKSPACE_ROOT:-/var/lib/agent-board/workspaces}
      - ${AGENT_BOARD_REPOSITORY_ROOT:-.}:${AGENT_BOARD_REPOSITORY_MOUNT_PATH:-/repositories}:ro
      - ${AGENT_BOARD_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - postgres-credentials:/run/agent-board:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    ports:
      - "${AGENT_BOARD_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  postgres-credentials:
